include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

variables:
  GOLANG_VERSION: "1.26.9" # exact: a floating tag would build with whatever patch release is current
  SAST_EXCLUDED_PATHS: "*_test.go, *.md"

stages:
  - build
  - test
  - release

.build_common_rules:
  rules:
    - if: $MIRROR_SYNC == "true" # the mirror pipeline runs mirror-sync and nothing else
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # only run on MRs
    - if: $CI_COMMIT_TAG
      variables:
        PKG_VERSION: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

.build_common:
  image: golang:${GOLANG_VERSION}-trixie
  variables:
    PKG_VERSION: 0.0.0-dev.${CI_PIPELINE_ID}
  extends:
    - .build_common_rules

# CGO_ENABLED=0 (set in the Makefile) is what lets one Linux runner build every
# target, macOS included: go-keyring reaches the Keychain without cgo.
build:
  extends:
    - .build_common
  stage: build
  # Not on tags: the release job builds and names the tagged binaries, so a
  # tag pipeline would otherwise build them twice, under two naming styles.
  # lint and unit-test keep the shared rules, since the release job needs them.
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.build_common_rules, rules]
  parallel:
    matrix:
      - GOOS: linux
        GOARCH: [amd64, arm64]
      - GOOS: darwin
        GOARCH: [amd64, arm64]
      - GOOS: windows
        GOARCH: [amd64]
  script:
    - EXE_NAME="aigw-${GOOS}-${GOARCH}"
    # An if, not `[ ... ] && ...`: that form exits non-zero for every other
    # GOOS, and the job script stops on the first non-zero exit.
    - if [ "$GOOS" = windows ]; then EXE_NAME="${EXE_NAME}.exe"; fi
    - make build EXE_NAME="$EXE_NAME"
  artifacts:
    paths:
      - ./aigw-*
    expire_in: 30 min

lint:
  extends:
    - .build_common
  stage: test
  script:
    - make lint_ci
  artifacts:
    when: always
    paths:
      - gl-code-quality-report.json
    reports:
      codequality: gl-code-quality-report.json

unit-test:
  extends:
    - .build_common
  stage: test
  script:
    - make test_coverage
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+%)/'

# Runs the unit tests on Windows, where the Linux jobs cannot reach: paths,
# USERPROFILE, file modes, line endings, the console. It uses GitLab's hosted
# Windows runner, which has no Go, so it fetches the pinned release from
# go.dev and checks it against the SHA-256 go.dev publishes. Not in the
# release job's needs yet: promote it once it has been green for a while.
#
# Fetching and unpacking Go took 13 of its 20 minutes. Windows PowerShell's
# progress bar slows Invoke-WebRequest badly, and Expand-Archive is slow on
# Go's thousands of files, so the progress bar is off and Windows' own
# bsdtar unpacks (named by path: a GNU tar from Git for Windows cannot read
# zips). needs: [] starts it at once, without the build artifacts it never
# used, and it runs only when something it tests changed.
unit-test-windows:
  stage: test
  needs: []
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: $MIRROR_SYNC == "true"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &windows_test_inputs
        - "**/*.go"
        - internal/skill/SKILL.md # embedded in the binary
        - internal/gen/*.tpl
        - go.mod
        - go.sum
        - .gitattributes
        - .gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *windows_test_inputs
  script:
    - $ProgressPreference = 'SilentlyContinue'
    - $zip = "go$env:GOLANG_VERSION.windows-amd64.zip"
    - Invoke-WebRequest -Uri "https://go.dev/dl/$zip" -OutFile $zip
    - $want = (Invoke-RestMethod "https://go.dev/dl/?mode=json&include=all").files | Where-Object { $_.filename -eq $zip } | Select-Object -ExpandProperty sha256
    - if (-not $want -or (Get-FileHash $zip -Algorithm SHA256).Hash -ne $want.ToUpper()) { throw "checksum mismatch for $zip" }
    - New-Item -ItemType Directory -Force "$env:TEMP\go-sdk" | Out-Null
    - '& "$env:SystemRoot\System32\tar.exe" -xf $zip -C "$env:TEMP\go-sdk"'
    - if ($LASTEXITCODE -ne 0) { throw "tar failed with exit code $LASTEXITCODE" }
    - $env:Path = "$env:TEMP\go-sdk\go\bin;$env:Path"
    - go version
    - go test ./...

# Regenerates the API commands from the pinned spec and fails if the result
# differs from the checked-in operations_gen.go. It reads loginid-aigw with the
# job token, so it stays allowed to fail until loginid-aigw lists this project
# in Settings > CI/CD > Job token permissions.
generate-check:
  extends:
    - .build_common
  stage: test
  script:
    - make generate_check
  allow_failure: true

.goreleaser:
  image:
    name: goreleaser/goreleaser:v2.18.2
    entrypoint: [""]
  # GoReleaser reads tags and the changelog from git history.
  variables:
    GIT_DEPTH: 0

# Builds the release artifacts on every MR without uploading anything, so a
# broken .goreleaser.yaml shows up before a tag does.
goreleaser-snapshot:
  extends:
    - .goreleaser
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - goreleaser check
    - goreleaser release --snapshot --clean
  artifacts:
    paths:
      # The zips, plus each bare binary once. dist/aigw_* would also take the
      # build folders whole. A snapshot keeps each bare binary in its build
      # folder; it gets its versioned name only when a release uploads it, so
      # a dist/aigw_*_linux_amd64 pattern would match nothing.
      - dist/aigw_*.zip
      - dist/aigw_linux_*/aigw
      - dist/checksums.txt
      # The rendered cask, to review what a release would push to the tap.
      - dist/homebrew/Casks/*.rb
    expire_in: 1 day

# On a v* tag, after lint and tests pass: builds the per-OS binaries and zips
# and attaches them, with checksums.txt, to a GitLab release for devops.
# Uploads use CI_JOB_TOKEN (see gitlab_urls in .goreleaser.yaml).
# The GitHub release and the Homebrew cask come from the mirror's own
# workflow (.github/workflows/release.yml), so this job skips homebrew.
release:
  extends:
    - .goreleaser
  stage: release
  rules:
    # Anchored: v1.2.3 and v1.2.3-alpha.1 release; v1.2.3junk does not.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
  needs:
    - lint
    - unit-test
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  script:
    # The runner also sets a GITHUB_TOKEN. With it gone, GITLAB_TOKEN is the
    # only token, so GoReleaser releases to GitLab.
    - unset GITHUB_TOKEN
    - goreleaser release --clean --skip=homebrew

# Pushes main, and every v* tag in main's history, to the read-only mirror at
# github.com/loginid1/loginid-aigw-cli. The single-branch clone brings exactly
# the tags in main's history; tags on other branches stay off the mirror, along
# with their commits, and so do tags that do not start with v. A v* tag
# reaching the mirror starts its release workflow.
# Runs in pipelines that set MIRROR_SYNC=true (the daily schedule, or a manual
# run), and in release tag pipelines, so a new tag reaches GitHub without
# waiting for the schedule. That schedule also sets SAST_DISABLED,
# SECRET_DETECTION_DISABLED and DEPENDENCY_SCANNING_DISABLED so the included
# security jobs stay out of it.
#
# GITHUB_MIRROR_TOKEN is a fine-grained GitHub token for loginid1/loginid-aigw-cli
# only, with Contents and Workflows read/write. A deploy key cannot do this:
# GitHub refuses pushes that add or change .github/workflows without the
# workflow permission. It is a protected variable, so only protected refs can
# push; v* tags are protected tags for that reason.
# A tag whose commit is not on main is not in the clone, so it is not pushed.
# The push is not forced: if GitHub ever has commits GitLab lacks, or a tag was
# moved on GitLab after it was mirrored, the job fails instead of overwriting.
mirror-sync:
  # The last stage with no needs: it starts at once, and if it fails, the
  # tests and the GitLab release in a tag pipeline still run.
  stage: release
  needs: []
  image: alpine:3.22
  variables:
    GIT_STRATEGY: none # clones main itself below, whatever ref the pipeline ran on
  rules:
    - if: $MIRROR_SYNC == "true"
    # The same pattern as the release job.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
  before_script:
    # Unprotected refs do not get the protected token; say so instead of a 401.
    - '[ -n "$GITHUB_MIRROR_TOKEN" ] || { echo "GITHUB_MIRROR_TOKEN is empty: is this ref protected?"; exit 1; }'
    - apk add --no-cache git
  script:
    - git clone --bare --single-branch --branch main "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" src.git
    - echo "pushing main at $(git -C src.git rev-parse main)"
    # The token is masked in the job log.
    - git -C src.git push "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/loginid1/loginid-aigw-cli.git" main:main "refs/tags/v*:refs/tags/v*"
