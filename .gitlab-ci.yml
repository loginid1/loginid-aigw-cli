include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

variables:
  GOLANG_VERSION: "1.26.9" # exact: a floating tag would build with whatever patch release is current
  SAST_EXCLUDED_PATHS: "*_test.go, *.md"

stages:
  - build
  - test
  - release

.build_common_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # only run on MRs
    - if: $CI_COMMIT_TAG
      variables:
        PKG_VERSION: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

.build_common:
  image: golang:${GOLANG_VERSION}-trixie
  variables:
    PKG_VERSION: 0.0.0-dev.${CI_PIPELINE_ID}
  extends:
    - .build_common_rules

# CGO_ENABLED=0 (set in the Makefile) is what lets one Linux runner build every
# target, macOS included: go-keyring reaches the Keychain without cgo.
build:
  extends:
    - .build_common
  stage: build
  parallel:
    matrix:
      - GOOS: linux
        GOARCH: [amd64, arm64]
      - GOOS: darwin
        GOARCH: [amd64, arm64]
      - GOOS: windows
        GOARCH: [amd64]
  script:
    - EXE_NAME="aigw-${GOOS}-${GOARCH}"
    # An if, not `[ ... ] && ...`: that form exits non-zero for every other
    # GOOS, and the job script stops on the first non-zero exit.
    - if [ "$GOOS" = windows ]; then EXE_NAME="${EXE_NAME}.exe"; fi
    - make build EXE_NAME="$EXE_NAME"
  artifacts:
    paths:
      - ./aigw-*
    expire_in: 30 min

lint:
  extends:
    - .build_common
  stage: test
  script:
    - make lint_ci
  artifacts:
    when: always
    paths:
      - gl-code-quality-report.json
    reports:
      codequality: gl-code-quality-report.json

unit-test:
  extends:
    - .build_common
  stage: test
  script:
    - make test_coverage
  coverage: '/^total:\s+\(statements\)\s+(\d+\.\d+%)/'

# Regenerates the API commands from the pinned spec and fails if the result
# differs from the checked-in operations_gen.go. It reads loginid-aigw with the
# job token, so it stays allowed to fail until loginid-aigw lists this project
# in Settings > CI/CD > Job token permissions.
generate-check:
  extends:
    - .build_common
  stage: test
  script:
    - make generate_check
  allow_failure: true

.goreleaser:
  image:
    name: goreleaser/goreleaser:v2.18.2
    entrypoint: [""]
  # GoReleaser reads tags and the changelog from git history.
  variables:
    GIT_DEPTH: 0

# Builds the release artifacts on every MR without uploading anything, so a
# broken .goreleaser.yaml shows up before a tag does.
goreleaser-snapshot:
  extends:
    - .goreleaser
  stage: build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - goreleaser check
    - goreleaser release --snapshot --clean
  artifacts:
    paths:
      - dist/aigw_*
      - dist/checksums.txt
    expire_in: 1 day

# On a v* tag, after lint and tests pass: builds the per-OS binaries and zips
# and attaches them, with checksums.txt, to a GitLab release for devops.
# Uploads use CI_JOB_TOKEN (see gitlab_urls in .goreleaser.yaml).
release:
  extends:
    - .goreleaser
  stage: release
  rules:
    # Anchored: v1.2.3 and v1.2.3-alpha.1 release; v1.2.3junk does not.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/
  needs:
    - lint
    - unit-test
  script:
    - goreleaser release --clean
