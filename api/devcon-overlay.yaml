# Maps each devcon REST operation to its aigw command.
#
# internal/gen reads this next to the spec. Every operation in the spec must have
# an entry here, and every entry must match an operation, so a new or removed API
# route fails `make generate` until someone decides what it is called.
#
# Scopes are not set here: they come from each operation's x-required-scope.
#
# returns_secret: true|false overrides the generator's detection of responses
# that carry a one-time secret (fields named *secret, *token, *password,
# *privateKey, *apiKey, *credential). `aigw mcp` hides those tools unless
# --expose-secrets is set.
#
# Naming: PATCH is `update`, because a partial change is what people usually
# want. PUT, a full replace, is `replace`.
operations:
  projects#list:                       { command: projects list }
  projects#create:                     { command: projects create }
  projects#get:                        { command: projects get }
  projects#update:                     { command: projects update }
  projects#delete:                     { command: projects delete }

  projects#listProxyClients:           { command: projects proxy-clients list }
  projects#generateProxyClient:        { command: projects proxy-clients create }
  projects#revokeProxyClient:          { command: projects proxy-clients revoke }

  resources#list:                      { command: resources list }
  resources#create:                    { command: resources create }
  resources#get:                       { command: resources get }
  resources#patch:                     { command: resources update }
  resources#update:                    { command: resources replace }
  resources#delete:                    { command: resources delete }

  resources#getAuthenticationSettings: { command: resources auth-settings get }
  resources#setAuthenticationSettings: { command: resources auth-settings update }

  resources#listScopes:                { command: resources scopes list }

  resources#listSigningKeys:           { command: resources signing-keys list }
  resources#generateSigningKey:        { command: resources signing-keys create }

  # Agent domain rules: approve or reject agents by the domain they come from.
  # The project list also shows each resource's own rules.
  agentDomainRules#list:               { command: projects domain-rules list }
  agentDomainRules#getProject:         { command: projects domain-rules get }
  agentDomainRules#setProject:         { command: projects domain-rules set }
  agentDomainRules#removeProject:      { command: projects domain-rules remove }
  agentDomainRules#listResource:       { command: resources domain-rules list }
  agentDomainRules#getResource:        { command: resources domain-rules get }
  agentDomainRules#setResource:        { command: resources domain-rules set }
  agentDomainRules#removeResource:     { command: resources domain-rules remove }

  # Agent policy: the project default, and a resource's own policy.
  agentPolicy#list:                    { command: projects agent-policy list }
  agentPolicy#getProject:              { command: projects agent-policy get }
  agentPolicy#setProject:              { command: projects agent-policy update }
  agentPolicy#clearProject:            { command: projects agent-policy clear }
  agentPolicy#getResource:             { command: resources agent-policy get }
  agentPolicy#setResource:             { command: resources agent-policy update }
  agentPolicy#clearResource:           { command: resources agent-policy clear }

  # KYA issuer whitelist. `replace` swaps the whole list; `set` writes one entry.
  kyaIssuerPolicy#listProject:         { command: projects kya-issuers list }
  kyaIssuerPolicy#replaceProject:      { command: projects kya-issuers replace }
  kyaIssuerPolicy#getProject:          { command: projects kya-issuers get }
  kyaIssuerPolicy#setProject:          { command: projects kya-issuers set }
  kyaIssuerPolicy#removeProject:       { command: projects kya-issuers remove }
  kyaIssuerPolicy#listResource:        { command: resources kya-issuers list }
  kyaIssuerPolicy#replaceResource:     { command: resources kya-issuers replace }
  kyaIssuerPolicy#getResource:         { command: resources kya-issuers get }
  kyaIssuerPolicy#setResource:         { command: resources kya-issuers set }
  kyaIssuerPolicy#removeResource:      { command: resources kya-issuers remove }
