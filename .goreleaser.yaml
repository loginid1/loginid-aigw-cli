# Builds the per-OS release artifacts: for each target, the bare binary and a
# zip of it, plus checksums.txt. Two pipelines run it on every v* tag:
#   - GitLab CI (.gitlab-ci.yml) releases to GitLab, for devops, with
#     --skip=homebrew.
#   - The GitHub mirror (.github/workflows/release.yml) releases to
#     github.com/loginid1/loginid-aigw-cli and updates the Homebrew cask.
# GoReleaser releases to whichever forge its token is for: GITLAB_TOKEN or
# GITHUB_TOKEN. Each pipeline sets only its own.
#
# Locally:
#   goreleaser release --snapshot --clean   # build into dist/, upload nothing
version: 2

project_name: aigw

builds:
  - id: aigw
    # "." rather than ./main.go, so the binary records its module path and
    # VCS revision, as `make build` does.
    main: .
    binary: aigw
    # Reproducible: file times come from the commit, not the build machine.
    mod_timestamp: "{{ .CommitTimestamp }}"
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X gitlab.com/loginid/software/loginid-aigw-cli.git/internal/version.Version={{ .Version }}
      - -X gitlab.com/loginid/software/loginid-aigw-cli.git/internal/version.GitCommit={{ .ShortCommit }}
    # The zip archive names the Windows binary aigw.exe. The Homebrew cask
    # takes only the darwin and linux zips.
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: zip
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # The binary and the third-party license notices it must carry. Without
    # a files list GoReleaser would add README and LICENSE files instead.
    files:
      - src: THIRD_PARTY_NOTICES.txt
        info:
          mtime: "{{ .CommitDate }}"
    builds_info:
      mtime: "{{ .CommitDate }}"
  - id: binary
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^Merge branch"

# No github or gitlab section: GoReleaser allows only one, and without one it
# releases to the repo the origin remote points at. That is GitLab in GitLab CI
# and the mirror in its workflow.
release:
  # The bare binaries cannot carry the notices themselves, so they ship as a
  # file of their own next to them.
  extra_files:
    - glob: THIRD_PARTY_NOTICES.txt

# Upload through the generic package registry with CI_JOB_TOKEN, so the
# release job needs no personal or project access token. The job passes it in
# as GITLAB_TOKEN; GoReleaser uses job-token auth when that equals CI_JOB_TOKEN.
gitlab_urls:
  use_package_registry: true
  use_job_token: true

# Writes Casks/aigw-cli.rb to github.com/loginid1/homebrew-tap, so that
#   brew install loginid1/tap/aigw-cli
# installs the zip from the GitHub release. Only the mirror's workflow runs
# this; it pushes over SSH with a write deploy key on the tap repo.
homebrew_casks:
  - name: aigw-cli
    ids: [zip]
    binaries: [aigw]
    homepage: https://github.com/loginid1/loginid-aigw-cli
    description: Command-line client for the LoginID AI Gateway
    # Ruby interpolation uses the installed cask version and keeps the box aligned.
    caveats: |
      ╭────────────────────────────────────────────────────────╮
      │                                                        │
      │     █████╗ ██╗ ██████╗ ██╗    ██╗                      │
      │    ██╔══██╗██║██╔════╝ ██║    ██║                      │
      │    ███████║██║██║  ███╗██║ █╗ ██║                      │
      │    ██╔══██║██║██║   ██║██║███╗██║                      │
      │    ██║  ██║██║╚██████╔╝╚███╔███╔╝                      │
      │    ╚═╝  ╚═╝╚═╝ ╚═════╝  ╚══╝╚══╝                       │
      │                                                        │
      │    LoginID  ▸  AI Gateway#{"v#{version}".rjust(26)}    │
      │    ────────────────────────────────────────────────    │
      │    verified identity for every agent, every call       │
      │                                                        │
      ╰────────────────────────────────────────────────────────╯
    # Prereleases (v1.2.3-rc.1) get a GitHub release but leave the cask alone.
    skip_upload: auto
    repository:
      owner: loginid1
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:loginid1/homebrew-tap.git
        # envOrDefault: MR snapshot jobs render the cask without the key.
        private_key: '{{ envOrDefault "HOMEBREW_TAP_SSH_KEY" "" }}'
    # GoReleaser 2.18 has no hooks.post.install_steps; custom_block emits the
    # supported Homebrew DSL without the deprecated postflight Ruby hook.
    # Escape Homebrew's install-time token through GoReleaser's template.
    # Preserve quarantine removal for the unsigned macOS binary.
    custom_block: |
      on_macos do
        postflight_steps do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/aigw"]
        end
      end
